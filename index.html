<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tuân Hà x Mizze — Key Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --border: #2a2a2a;
    --silver: #c8c8c8;
    --silver-bright: #e8e8e8;
    --silver-dim: #666;
    --gold: #d4af37;
    --text: #e0e0e0;
    --text-dim: #888;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100%;
    -webkit-font-smoothing: antialiased;
  }

  /* HEADER */
  .header {
    text-align: center;
    padding: 40px 20px 24px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .logo-wrap {
    width: 130px;
    height: 130px;
    margin: 0 auto 16px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid #333;
    box-shadow: 0 0 30px rgba(200,200,200,0.12), 0 0 60px rgba(200,200,200,0.05);
  }
  .logo-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .shop-name {
    font-family: 'Cinzel', serif;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 3px;
    color: var(--silver-bright);
    text-shadow: 0 0 20px rgba(200,200,200,0.3);
  }
  .shop-sub {
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--silver-dim);
    margin-top: 4px;
    text-transform: uppercase;
  }

  /* NAV TABS */
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .tab {
    flex: 1;
    padding: 14px 0;
    text-align: center;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color .2s, border-color .2s;
    font-family: 'Cinzel', serif;
  }
  .tab.active {
    color: var(--silver-bright);
    border-bottom-color: var(--silver-bright);
  }

  /* PAGES */
  .page { display: none; padding: 24px 16px 80px; max-width: 500px; margin: 0 auto; }
  .page.active { display: block; }

  /* SECTION LABEL */
  .section-label {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--silver-dim);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  /* KEY CARDS */
  .key-grid { display: flex; flex-direction: column; gap: 12px; }

  .key-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    transition: border-color .2s, box-shadow .2s;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .key-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(200,200,200,0.15), transparent);
  }
  .key-card:active {
    border-color: #555;
    box-shadow: 0 0 20px rgba(200,200,200,0.08);
  }

  .key-icon {
    width: 48px;
    height: 48px;
    border-radius: 8px;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .key-info { flex: 1; }
  .key-name {
    font-family: 'Cinzel', serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--silver-bright);
    margin-bottom: 4px;
  }
  .key-desc {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.4;
  }
  .key-price-wrap { text-align: right; flex-shrink: 0; }
  .key-price {
    font-family: 'Cinzel', serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--silver-bright);
  }
  .key-unit {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  /* BADGE BEST */
  .badge {
    position: absolute;
    top: 10px; right: 10px;
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gold);
    border: 1px solid var(--gold);
    padding: 2px 6px;
    border-radius: 3px;
    font-family: 'Cinzel', serif;
  }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #111;
    border: 1px solid #2a2a2a;
    border-bottom: none;
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 500px;
    padding: 28px 24px calc(28px + env(safe-area-inset-bottom, 0px));
    animation: slideUp .25s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal-handle {
    width: 36px; height: 4px;
    background: #333;
    border-radius: 2px;
    margin: 0 auto 20px;
  }
  .modal-title {
    font-family: 'Cinzel', serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--silver-bright);
    margin-bottom: 6px;
  }
  .modal-price {
    font-family: 'Cinzel', serif;
    font-size: 26px;
    font-weight: 900;
    color: var(--silver-bright);
    text-shadow: 0 0 20px rgba(200,200,200,0.2);
    margin-bottom: 20px;
  }
  .modal-info {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.6;
    margin-bottom: 24px;
  }
  .btn-buy {
    width: 100%;
    padding: 15px;
    background: var(--silver-bright);
    color: #000;
    border: none;
    border-radius: 10px;
    font-family: 'Cinzel', serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    transition: opacity .2s;
  }
  .btn-buy:active { opacity: 0.85; }
  .btn-cancel {
    width: 100%;
    padding: 13px;
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 13px;
    cursor: pointer;
    margin-top: 10px;
    transition: border-color .2s;
  }
  .btn-cancel:active { border-color: #555; }

  /* ADMIN PAGE */
  .admin-section { margin-bottom: 28px; }
  .admin-title {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--silver-dim);
    margin-bottom: 14px;
    text-transform: uppercase;
  }
  .input-group { margin-bottom: 12px; }
  .input-group label {
    display: block;
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .input-group input, .input-group select, .input-group textarea {
    width: 100%;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color .2s;
  }
  .input-group input:focus, .input-group select:focus, .input-group textarea:focus {
    border-color: #555;
  }
  .input-group select option { background: #111; }
  .input-group textarea { resize: vertical; min-height: 80px; }
  .btn-add {
    width: 100%;
    padding: 13px;
    background: #1a1a1a;
    color: var(--silver-bright);
    border: 1px solid #3a3a3a;
    border-radius: 8px;
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: border-color .2s;
  }
  .btn-add:active { border-color: #666; }

  .key-list-admin { display: flex; flex-direction: column; gap: 10px; }
  .key-item-admin {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .key-item-admin .key-text {
    flex: 1;
    font-size: 13px;
    color: var(--silver);
    font-family: monospace;
    word-break: break-all;
  }
  .key-item-admin .key-tier {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }
  .btn-del {
    background: none;
    border: 1px solid #3a1a1a;
    color: #c44;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: calc(80px + env(safe-area-inset-bottom, 0px));
    left: 50%; transform: translateX(-50%);
    background: #1a1a1a;
    border: 1px solid #3a3a3a;
    color: var(--silver-bright);
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    z-index: 200;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity .3s;
  }
  .toast.show { opacity: 1; }

  /* EMPTY STATE */
  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-dim);
    font-size: 13px;
  }
  .empty-icon { font-size: 32px; margin-bottom: 10px; }

  /* KEY REVEAL */
  .key-reveal {
    background: #0d1a0d;
    border: 1px solid #1a3a1a;
    border-radius: 10px;
    padding: 20px;
    text-align: center;
    margin-top: 16px;
  }
  .key-reveal .reveal-label {
    font-size: 11px; letter-spacing: 2px; color: #4a8a4a;
    text-transform: uppercase; margin-bottom: 10px;
  }
  .key-reveal .reveal-key {
    font-family: monospace;
    font-size: 15px;
    color: #7ccc7c;
    word-break: break-all;
    line-height: 1.6;
  }
  .btn-copy {
    margin-top: 12px;
    padding: 8px 20px;
    background: #1a3a1a;
    color: #7ccc7c;
    border: 1px solid #2a5a2a;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }

  /* MUSIC BUTTON */
  .music-btn {
    position: fixed;
    right: 16px;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    width: 46px; height: 46px;
    border-radius: 50%;
    background: #111;
    border: 1px solid #3a3a3a;
    color: var(--silver-bright);
    font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 150;
    box-shadow: 0 0 18px rgba(200,200,200,0.12);
  }
  .music-btn.playing { animation: spin 4s linear infinite; border-color: #888; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

          <option value="1h">1 Giờ — 5.000đ</option>
          <option value="1d">1 Ngày — 25.000đ</option>
          <option value="1w">1 Tuần — 70.000đ</option>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const ADMIN_PASS = 'admin123';
const TIERS = {
  '1h': { label: '1 Giờ', price: '5.000đ', icon: '⚡', desc: 'Truy cập trong 1 giờ. Phù hợp dùng thử nhanh.' },
  '1d': { label: '1 Ngày', price: '25.000đ', icon: '🌙', desc: 'Truy cập đầy đủ trong 24 giờ.' },
  '1w': { label: '1 Tuần', price: '70.000đ', icon: '🔥', desc: 'Dùng thoải mái suốt 7 ngày.', best: true },
  '1m': { label: '1 Tháng', price: '150.000đ', icon: '👑', desc: 'Giá trị nhất cho người dùng thường xuyên.' },
  'vv': { label: 'Vĩnh Viễn', price: '500.000đ', icon: '♾️', desc: 'Mua một lần, dùng mãi mãi. Không gia hạn.' }
};

// Storage
function getKeys() { try { return JSON.parse(localStorage.getItem('keys') || '[]'); } catch { return []; } }
function saveKeys(k) { localStorage.setItem('keys', JSON.stringify(k)); }

function renderShop() {
  const keys = getKeys();
  const grid = document.getElementById('key-grid');
  grid.innerHTML = '';
  ['1h','1d','1w','1m','vv'].forEach(tier => {
    const t = TIERS[tier];
    const count = keys.filter(k => k.tier === tier && !k.sold).length;
    const card = document.createElement('div');
    card.className = 'key-card';
    card.onclick = () => openModal(tier);
    card.innerHTML = `
      ${t.best ? '<div class="badge">Best</div>' : ''}
      <div class="key-icon">${t.icon}</div>
      <div class="key-info">
        <div class="key-name">${t.label}</div>
        <div class="key-desc">${t.desc}</div>
      </div>
      <div class="key-price-wrap">
        <div class="key-price">${t.price}</div>
        <div class="key-unit">${count} key còn</div>
      </div>
    `;
    grid.appendChild(card);
  });
}

let currentTier = null;
let keyRevealed = false;

function openModal(tier) {
  currentTier = tier;
  keyRevealed = false;
  const t = TIERS[tier];
  const keys = getKeys();
  const avail = keys.filter(k => k.tier === tier && !k.sold).length;
  document.getElementById('modal-title').textContent = `Key ${t.label}`;
  document.getElementById('modal-price').textContent = t.price;
  document.getElementById('modal-info').textContent = avail > 0
    ? `Còn ${avail} key · ${t.desc}`
    : 'Hết key — liên hệ admin để bổ sung.';
  document.getElementById('modal-key-reveal').innerHTML = '';
  const btn = document.getElementById('modal-btn');
  btn.style.display = avail > 0 ? 'block' : 'none';
  btn.textContent = 'Nhận Key Ngay';
  document.getElementById('modal').classList.add('open');
}

function confirmBuy() {
  if (keyRevealed) return;
  const keys = getKeys();
  const idx = keys.findIndex(k => k.tier === currentTier && !k.sold);
  if (idx === -1) { showToast('Hết key rồi!'); return; }
  keys[idx].sold = true;
  saveKeys(keys);
  const key = keys[idx].value;
  keyRevealed = true;
  document.getElementById('modal-btn').style.display = 'none';
  document.getElementById('modal-key-reveal').innerHTML = `
    <div class="key-reveal">
      <div class="reveal-label">Key của bạn</div>
      <div class="reveal-key">${key}</div>
      <button class="btn-copy" onclick="navigator.clipboard.writeText('${key}'); showToast('Đã copy!')">Copy Key</button>
    </div>
  `;
  renderShop();
  renderAdminKeys();
}

function closeModal(e) {
  if (e.target === document.getElementById('modal')) {
    document.getElementById('modal').classList.remove('open');
  }
}

// ADMIN
function adminLogin() {
  const p = document.getElementById('admin-pass').value;
  if (p === ADMIN_PASS) {
    document.getElementById('admin-locked').style.display = 'none';
    document.getElementById('admin-panel').style.display = 'block';
    renderAdminKeys();
  } else {
    showToast('Sai mật khẩu!');
  }
}

function addKeys() {
  const tier = document.getElementById('new-tier').value;
  const raw = document.getElementById('new-keys').value.trim();
  if (!raw) { showToast('Nhập key đi!'); return; }
  const newKeys = raw.split('\n').map(k => k.trim()).filter(Boolean);
  const keys = getKeys();
  newKeys.forEach(v => keys.push({ tier, value: v, sold: false, id: Date.now() + Math.random() }));
  saveKeys(keys);
  document.getElementById('new-keys').value = '';
  renderAdminKeys();
  renderShop();
  showToast(`Đã thêm ${newKeys.length} key!`);
}

function renderAdminKeys() {
  const keys = getKeys();
  const list = document.getElementById('key-list-admin');
  if (!list) return;
  const avail = keys.filter(k => !k.sold);
  if (avail.length === 0) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">🗝️</div>Chưa có key nào</div>';
    return;
  }
  list.innerHTML = avail.map((k,i) => `
    <div class="key-item-admin">
      <div>
        <div class="key-tier">${TIERS[k.tier]?.label || k.tier}</div>
        <div class="key-text">${k.value}</div>
      </div>
      <button class="btn-del" onclick="deleteKey(${JSON.stringify(k.id)})">Xóa</button>
    </div>
  `).join('');
}

function deleteKey(id) {
  const keys = getKeys().filter(k => k.id !== id);
  saveKeys(keys);
  renderAdminKeys();
  renderShop();
  showToast('Đã xóa key');
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['shop','admin'][i] === tab));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  if (tab === 'admin') renderAdminKeys();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// Enter key login
document.getElementById('admin-pass').addEventListener('keydown', e => { if (e.key === 'Enter') adminLogin(); });

renderShop();
</script>

<script>
(function(){
  const audio = new Audio('music.mp3');
  audio.loop = true;
  audio.volume = 0.5;
  function play(){ if (audio.paused) audio.play().catch(function(){}); }
  // Trình duyệt chặn tự phát, nên phát ở lần chạm đầu tiên và tự phát lại nếu bị dừng
  document.addEventListener('pointerdown', play);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) play(); });
  audio.addEventListener('pause', function(){ setTimeout(play, 300); });
})();
</script>
</body>
</html>
